[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["app/src-tauri"]

[workspace.package]
version = "0.2.1"
edition = "2021"
rust-version = "1.82"
license = "MIT"

[workspace.dependencies]
# --- 序列化 ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 有序 Map：PAC 规则顺序敏感，不能用 HashMap
indexmap = { version = "2", features = ["serde"] }

# --- 错误与日志 ---
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- 异步运行时 ---
tokio = { version = "1", features = [
  "rt-multi-thread",
  "net",
  "io-util",
  "time",
  "sync",
  "macros",
  "signal",
  "fs",
  "process",
] }

# --- HTTP ---
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "client-legacy"] }
http-body-util = "0.1"

# --- TLS ---
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  # ECH 需要 HPKE，而 0.23 只有 aws-lc-rs 提供者实现了 HPKE（ring 没有 hpke 模块）。
  # 两个 provider 可以共存：普通连接用 ring，ECH 连接用 aws-lc-rs。
  "aws_lc_rs",
  "std",
  "tls12",
  "logging",
] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "aws_lc_rs", "tls12"] }
rustls-pki-types = "1"
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
rustls-native-certs = "0.8"

# --- 指纹伪装：BoringSSL ---
# 用 Chrome 同源的 BoringSSL 才能把 JA4 对齐（rustls 的扩展顺序/ALPS/ECH grease 都不可控，
# 结论见 docs/FINGERPRINT.md 与 docs/FINGERPRINT-B1.md）。构建需要 nasm + cmake，约 4 分钟。
boring = "5"
miniz_oxide = "0.8"
# 必须与 boring 内部使用的大版本一致（boring 5.5 用 0.5），否则 Ssl::as_ptr 拿不到
foreign-types = "0.5"

# --- DNS ---
hickory-resolver = { version = "0.24", features = [
  "dns-over-rustls",
  "dns-over-https-rustls",
] }

# --- 工具 ---
regex = "1"
ipnet = "2"
bytes = "1"
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"

# --- 内部 crate ---
ds-types = { path = "crates/ds-types" }
ds-rules = { path = "crates/ds-rules" }
ds-dns = { path = "crates/ds-dns" }
ds-tls = { path = "crates/ds-tls" }
ds-pac = { path = "crates/ds-pac" }
ds-ctl = { path = "crates/ds-ctl" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 1

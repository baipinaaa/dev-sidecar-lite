[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
authors = ["dev-sidecar-lite contributors"]

[workspace.dependencies]
# --- 序列化 ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json5 = "0.4"

# 有序 Map：PAC 规则顺序敏感，不能用 HashMap
indexmap = { version = "2", features = ["serde"] }

# --- 错误与日志 ---
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- 异步运行时 ---
tokio = { version = "1", features = [
  "rt-multi-thread",
  "net",
  "io-util",
  "time",
  "sync",
  "macros",
  "signal",
  "fs",
  "process",
] }

# --- HTTP ---
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "client-legacy"] }
http-body-util = "0.1"

# --- TLS ---
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
  "logging",
] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = "1"
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
rustls-native-certs = "0.8"

# --- DNS ---
hickory-resolver = { version = "0.24", features = [
  "dns-over-rustls",
  "dns-over-https-rustls",
] }

# --- 工具 ---
regex = "1"
ipnet = "2"
bytes = "1"
futures-util = "0.3"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"

# --- 内部 crate ---
ds-types = { path = "crates/ds-types" }
ds-rules = { path = "crates/ds-rules" }
ds-dns = { path = "crates/ds-dns" }
ds-tls = { path = "crates/ds-tls" }
ds-pac = { path = "crates/ds-pac" }
ds-ctl = { path = "crates/ds-ctl" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 1

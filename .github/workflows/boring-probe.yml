name: boring-probe

# B1 可行性探针（docs/FINGERPRINT-B1.md 第六节）。只回答三个问题，不改仓库里的任何 crate：
#   1) `boring`（BoringSSL 绑定）在 windows-latest 上能不能构建、耗时多少；
#   2) crate 里有没有 ECH 相关绑定（boring 的 Rust 层 / BoringSSL 头文件 / bindgen 产物）；
#   3) 用它握手一次，抓 ClientHello 算 JA3，能不能对上 Chrome 156 的 cccf4f8d2e3c9bded07b40c216fe6216。
# 三个都正向才进入 B1a；否则转 B1b（wreq）或 B1c（维持 rustls）。

on:
  workflow_dispatch:
  push:
    branches: [boring-probe]

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: 准备构建依赖（nasm）
        shell: pwsh
        run: |
          # BoringSSL 需要 nasm 汇编器；cmake 与 ninja 在 runner 上自带
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install nasm -y --no-progress | Out-Null
            "C:/Program Files/NASM" | Out-File -FilePath $env:GITHUB_PATH -Append
            $env:PATH = "C:/Program Files/NASM;$env:PATH"
          }
          nasm -v
          cmake --version | Select-Object -First 1

      - name: 复制探针工程
        shell: pwsh
        run: |
          $dst = Join-Path $env:RUNNER_TEMP "probe"
          if (Test-Path $dst) { Remove-Item -Recurse -Force $dst }
          Copy-Item -Recurse -Path "tests/e2e/fingerprint-probe" -Destination $dst
          "PROBE_DIR=$dst" | Out-File -FilePath $env:GITHUB_ENV -Append
          Get-ChildItem -Recurse $dst | Select-Object FullName

      - name: 问题 1 —— 构建耗时
        shell: pwsh
        run: |
          Push-Location $env:PROBE_DIR
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          cargo build --release 2>&1 | Out-String | Write-Host
          $code = $LASTEXITCODE
          $sw.Stop()
          $secs = [int]$sw.Elapsed.TotalSeconds
          "PROBE_BUILD_SECONDS=$secs" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "boring 构建退出码 = $code，耗时 $secs 秒"
          Pop-Location
          if ($code -ne 0) {
            Write-Host "::error::boring 构建失败（见上方日志）"
            exit 1
          }

      - name: 问题 2 —— crate 里有没有 ECH 绑定
        shell: pwsh
        run: |
          # cargo fetch 只下 .crate，源码要等构建时才解压到 registry/src；
          # bindgen 产物在 target/<profile>/build/boring-sys-*/out/ 下，是最权威的答案。
          $reg = Join-Path (Join-Path $env:USERPROFILE ".cargo") "registry/src"
          $boringDirs = @(Get-ChildItem -Path $reg -Directory -Filter "boring-*" -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notlike "boring-sys-*" })
          if ($boringDirs.Count -eq 0) {
            Write-Host "::warning::registry/src 里没有 boring 源码"
          } else {
            foreach ($d in $boringDirs) {
              Write-Host "=== $($d.Name)：含 ech 的 Rust 绑定 ==="
              $hits = @(Get-ChildItem -Path $d.FullName -Recurse -Include *.rs -ErrorAction SilentlyContinue |
                Select-String -Pattern 'ech_config|set1_ech|ech_grease|EchConfig' -CaseSensitive:$false)
              if ($hits.Count -gt 0) {
                $hits | Select-Object -First 30 | ForEach-Object {
                  Write-Host ("  {0}:{1}: {2}" -f $_.Filename, $_.LineNumber, $_.Line.Trim())
                }
              } else {
                Write-Host "  （无）"
              }
            }
          }

          Write-Host "=== BoringSSL 头文件里的 ECH C API ==="
          $sysDirs = @(Get-ChildItem -Path $reg -Directory -Filter "boring-sys-*" -ErrorAction SilentlyContinue)
          if ($sysDirs.Count -gt 0) {
            $sysHits = @(Get-ChildItem -Path $sysDirs[0].FullName -Recurse -Include *.h -ErrorAction SilentlyContinue |
              Select-String -Pattern 'SSL_set1_ech_config_list|SSL_ech|ech_config_list' -CaseSensitive:$false)
            if ($sysHits.Count -gt 0) {
              $sysHits | Select-Object -First 20 | ForEach-Object {
                Write-Host ("  {0}:{1}: {2}" -f $_.Filename, $_.LineNumber, $_.Line.Trim())
              }
            } else {
              Write-Host "  （头文件里没有该符号）"
            }
          } else {
            Write-Host "  （registry/src 里没有 boring-sys 源码）"
          }

          Write-Host "=== bindgen 生成的绑定（权威）==="
          $bindings = @(Get-ChildItem -Path (Join-Path $env:PROBE_DIR "target") -Recurse -Filter "bindings.rs" -ErrorAction SilentlyContinue)
          if ($bindings.Count -gt 0) {
            $bHits = @($bindings | Select-String -Pattern 'ech' -CaseSensitive:$false)
            if ($bHits.Count -gt 0) {
              $bHits | Select-Object -First 30 | ForEach-Object { Write-Host ("  " + $_.Line.Trim()) }
            } else {
              Write-Host "  （bindings.rs 里没有任何 ech 符号）"
            }
          } else {
            Write-Host "  （没找到 bindings.rs）"
          }

      - name: 问题 3 —— 用 boring 握手一次并抓 ClientHello
        shell: pwsh
        run: |
          # 同一个 step 内起嗅探代理 + 跑探针（跨 step 的后台进程会被 runner 收掉）
          $env:PYTHONIOENCODING = "utf-8"
          $out = Join-Path $env:RUNNER_TEMP "probe-clienthello.bin"
          $recLog = Join-Path $env:RUNNER_TEMP "rec.log"
          $recErr = Join-Path $env:RUNNER_TEMP "rec.err"
          $port = 18999
          $rec = Start-Process -FilePath "python" -PassThru -NoNewWindow `
            -ArgumentList @("-u", (Resolve-Path "tests/e2e/clienthello_capture.py").Path, "--listen", "$port", "--out", "$out", "--timeout", "30") `
            -RedirectStandardOutput $recLog -RedirectStandardError $recErr
          Start-Sleep -Milliseconds 1500

          $exe = Join-Path $env:PROBE_DIR "target/release/fingerprint-probe.exe"
          & $exe "127.0.0.1:$port" "example.com" 2>&1 | Out-String | Write-Host
          Start-Sleep -Milliseconds 500
          if ($rec -and -not $rec.HasExited) { Stop-Process -Id $rec.Id -Force -ErrorAction SilentlyContinue }

          # 第二轮：chrome 模式（按 Chrome 156 的 JA3 反推配置）
          $out2 = Join-Path $env:RUNNER_TEMP "probe-clienthello-chrome.bin"
          $rec2 = Start-Process -FilePath "python" -PassThru -NoNewWindow `
            -ArgumentList @("-u", (Resolve-Path "tests/e2e/clienthello_capture.py").Path, "--listen", "$port", "--out", "$out2", "--timeout", "30") `
            -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP "rec2.log") -RedirectStandardError (Join-Path $env:RUNNER_TEMP "rec2.err")
          Start-Sleep -Milliseconds 1500
          & $exe "127.0.0.1:$port" "example.com" "chrome" 2>&1 | Out-String | Write-Host
          Start-Sleep -Seconds 1
          if ($rec2 -and -not $rec2.HasExited) { Stop-Process -Id $rec2.Id -Force -ErrorAction SilentlyContinue }
          if (Test-Path $out2) {
            Write-Host "=== 探针指纹（chrome 模式）==="
            $json2 = python tests/e2e/clienthello_capture.py --compute $out2
            $json2 | Out-String | Write-Host
            $json2 | Out-File -Encoding utf8 (Join-Path $env:RUNNER_TEMP "probe-ja3-chrome.json")
          } else {
            Write-Host "::warning::chrome 模式没有抓到 ClientHello"
          }

          if (-not (Test-Path $out)) {
            Write-Host "--- recorder stdout ---"
            Get-Content $recLog -ErrorAction SilentlyContinue | Write-Host
            Write-Host "--- recorder stderr ---"
            Get-Content $recErr -ErrorAction SilentlyContinue | Write-Host
            Write-Host "::error::没有抓到 ClientHello"
            exit 1
          }
          Write-Host "=== 探针指纹 ==="
          $json = python tests/e2e/clienthello_capture.py --compute $out
          $json | Out-String | Write-Host
          $json | Out-File -Encoding utf8 (Join-Path $env:RUNNER_TEMP "probe-ja3.json")

      - name: 汇总到 issue
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $lines = @("### boring-probe 结果", "")
          $secs = $env:PROBE_BUILD_SECONDS
          if ([string]::IsNullOrWhiteSpace($secs) -or $secs -eq "0") {
            $lines += "- boring 构建：**未完成或失败**（看 workflow 日志）"
          } else {
            $lines += "- boring 构建耗时：$secs 秒"
          }
          $ja3 = Join-Path $env:RUNNER_TEMP "probe-ja3.json"
          if (Test-Path $ja3) {
            $obj = (Get-Content $ja3 -Raw) | ConvertFrom-Json
            $lines += "- 探针 JA3：``$($obj.ja3)``"
            $lines += "- 探针 JA3 hash：``$($obj.ja3_hash)``"
            $lines += "- 探针 JA4：``$($obj.ja4)``"
            $lines += ""
            $lines += "对照 Chrome 156：hash ``cccf4f8d2e3c9bded07b40c216fe6216`` / JA4 ``t13d1517h2_``"
            if ($obj.ja3_hash -eq "cccf4f8d2e3c9bded07b40c216fe6216") {
              $lines += ""
              $lines += "**结论：完全一致 → B1a 可行。**"
            } else {
              $lines += ""
              $lines += "**结论：不完全一致（BoringSSL 版本或配置差异，需看日志里的版本号）。**"
            }
          } else {
            $lines += "- 未取得探针指纹"
          }
          $ja3c = Join-Path $env:RUNNER_TEMP "probe-ja3-chrome.json"
          if (Test-Path $ja3c) {
            $objc = (Get-Content $ja3c -Raw) | ConvertFrom-Json
            $lines += ""
            $lines += "chrome 模式（套件/groups/ALPN/ECH-grease 按 Chrome 156 配置）："
            $lines += "- JA3：``$($objc.ja3)``"
            $lines += "- hash：``$($objc.ja3_hash)`` / JA4：``$($objc.ja4)`` / ALPN：``$($objc.alpn -join ', ')``"
            if ($objc.ja3_hash -eq "cccf4f8d2e3c9bded07b40c216fe6216") {
              $lines += "- **与 Chrome 156 完全一致 → B1a 可直接落地。**"
            } else {
              $lines += "- 仍有差异，需按报告逐项补（扩展顺序 / ALPS / compress_certificate）"
            }
          }
          ($lines -join "`n") | Out-File -Encoding utf8 (Join-Path $env:RUNNER_TEMP "summary.md")
          gh issue comment 1 --repo ${{ github.repository }} --body-file (Join-Path $env:RUNNER_TEMP "summary.md")

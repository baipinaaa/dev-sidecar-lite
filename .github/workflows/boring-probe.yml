name: boring-probe

# B1 可行性探针（docs/FINGERPRINT-B1.md 第六节）。
# 只回答三个问题，不改动仓库里的任何 crate：
#   1) `boring`（BoringSSL 绑定）在 windows-latest 上能不能构建、耗时多少；
#   2) crate 里有没有 ECH 相关绑定（grep 源码里的 ech_config）；
#   3) 用它握手一次，抓 ClientHello 算 JA3，能不能对上 Chrome 的 cccf4f8d2e3c9bded07b40c216fe6216。
# 三个都正向才进入 B1a；否则转 B1b（wreq）或 B1c（维持 rustls）。

on:
  workflow_dispatch:
  push:
    branches: [boring-probe]

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: 准备构建依赖（nasm / cmake）
        shell: pwsh
        run: |
          # BoringSSL 需要 nasm 汇编器；cmake 与 ninja 在 runner 上自带
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install nasm -y --no-progress | Out-Null
            $env:PATH = "C:\Program Files\NASM;$env:PATH"
            "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append
          }
          nasm -v
          cmake --version | Select-Object -First 1

      - name: 建临时工程并拉依赖
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "probe"
          New-Item -ItemType Directory -Force -Path (Join-Path $dir "src") | Out-Null
          @'
          [package]
          name = "fingerprint-probe"
          version = "0.0.1"
          edition = "2021"

          [dependencies]
          boring = "4"
          '@ | Out-File -Encoding utf8 (Join-Path $dir "Cargo.toml")

          @'
          fn main() {
              println!("probe placeholder");
          }
          '@ | Out-File -Encoding utf8 (Join-Path $dir "src/main.rs")
          "PROBE_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: 问题 2 —— crate 里有没有 ECH 绑定
        shell: pwsh
        run: |
          Push-Location $env:PROBE_DIR
          cargo fetch 2>&1 | Out-String | Write-Host
          $reg = Join-Path $env:USERPROFILE ".cargo\registry\src"
          $boringDirs = Get-ChildItem -Path $reg -Directory -Filter "boring-*" -ErrorAction SilentlyContinue
          if (-not $boringDirs) {
            Write-Host "::error::没有找到 boring 源码目录（可能 cargo fetch 未成功）"
            exit 1
          }
          "=== boring 版本 ==="
          $boringDirs | ForEach-Object { $_.Name }
          "=== 含 ech 的绑定（前 40 行）==="
          $hits = Get-ChildItem -Path $boringDirs[0].FullName -Recurse -Include *.rs -ErrorAction SilentlyContinue |
            Select-String -Pattern 'ech_config|set1_ech|ech_grease|EchConfig' -CaseSensitive:$false
          if ($hits) {
            $hits | Select-Object -First 40 | ForEach-Object { "$($_.Path -replace [regex]::Escape($boringDirs[0].FullName), '')`:$($_.LineNumber): $($_.Line.Trim())" }
          } else {
            "（没有任何匹配 —— crate 未暴露 ECH）"
          }
          "=== boring-sys 里的 C 头（SSL_set1_ech_config_list 是否存在）==="
          $sysDirs = Get-ChildItem -Path $reg -Directory -Filter "boring-sys-*" -ErrorAction SilentlyContinue
          if ($sysDirs) {
            $sysHits = Get-ChildItem -Path $sysDirs[0].FullName -Recurse -Include *.h,*.rs -ErrorAction SilentlyContinue |
              Select-String -Pattern 'SSL_set1_ech_config_list|SSL_ech' -CaseSensitive:$false
            if ($sysHits) {
              $sysHits | Select-Object -First 20 | ForEach-Object { "$($_.Filename):$($_.LineNumber): $($_.Line.Trim())" }
            } else {
              "（boring-sys 也没有该符号）"
            }
          }
          Pop-Location

      - name: 问题 1 —— 构建耗时
        shell: pwsh
        run: |
          Push-Location $env:PROBE_DIR
          cargo clean -q
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          cargo build --release 2>&1 | Out-String | Write-Host
          $code = $LASTEXITCODE
          $sw.Stop()
          "PROBE_BUILD_SECONDS=$([int]$sw.Elapsed.TotalSeconds)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "boring 构建退出码 = $code，耗时 $([int]$sw.Elapsed.TotalSeconds) 秒"
          if ($code -ne 0) {
            Write-Host "::error::boring 构建失败（见上方日志）"
            exit 1
          }
          Pop-Location

      - name: 问题 3 —— 用 boring 握手一次并抓 ClientHello
        shell: pwsh
        run: |
          # 探针程序：连本地嗅探代理，用 boring 发一次 TLS 握手（等价 curl -x）
          @'
          use std::io::{Read, Write};
          use std::net::TcpStream;

          fn read_connect_response(stream: &mut TcpStream) {
              // 嗅探代理会先回 "HTTP/1.1 200 Connection Established"，必须读掉再开始 TLS
              let mut acc = Vec::new();
              let mut byte = [0u8; 1];
              while acc.len() < 8192 {
                  match stream.read(&mut byte) {
                      Ok(0) => break,
                      Ok(_) => {
                          acc.push(byte[0]);
                          if acc.ends_with(b"

") {
                              break;
                          }
                      }
                      Err(_) => break,
                  }
              }
          }

          fn main() {
              let args: Vec<String> = std::env::args().collect();
              let endpoint = args.get(1).cloned().unwrap_or_else(|| "127.0.0.1:18999".into());
              let host = args.get(2).cloned().unwrap_or_else(|| "example.com".into());

              let mut tcp = TcpStream::connect(&endpoint).expect("连不上嗅探代理");
              write!(tcp, "CONNECT {host}:443 HTTP/1.1
Host: {host}:443

").unwrap();
              read_connect_response(&mut tcp);

              let mut builder = boring::ssl::SslConnector::builder(boring::ssl::SslMethod::tls())
                  .expect("SslConnector::builder");
              builder.set_verify(boring::ssl::SslVerifyMode::NONE);
              let connector = builder.build();
              let mut stream = connector.connect(&host, tcp).expect("TLS 握手失败");
              stream
                  .write_all(format!("GET / HTTP/1.1
Host: {host}
Connection: close

").as_bytes())
                  .unwrap();
              let mut out = Vec::new();
              let _ = stream.read_to_end(&mut out);
              println!("握手完成，收到 {} 字节", out.len());
          }
          '@ | Out-File -Encoding utf8 (Join-Path $env:PROBE_DIR "src/main.rs")
          Push-Location $env:PROBE_DIR
          cargo build --release 2>&1 | Out-String | Write-Host
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::探针程序编译失败"; exit 1 }

          # 同一个 step 内起嗅探代理 + 跑探针（跨 step 后台进程会被 runner 收掉）
          $env:PYTHONIOENCODING = "utf-8"
          $out = Join-Path $env:RUNNER_TEMP "probe-clienthello.bin"
          $port = 18999
          $rec = Start-Process -FilePath "python" -PassThru -NoNewWindow `
            -ArgumentList @("-u", (Resolve-Path "tests/e2e/clienthello_capture.py").Path, "--listen", $port, "--out", $out, "--timeout", 30) `
            -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP "rec.log") -RedirectStandardError (Join-Path $env:RUNNER_TEMP "rec.err")
          Start-Sleep -Milliseconds 1200

          & (Join-Path $env:PROBE_DIR "target/release/fingerprint-probe.exe") "127.0.0.1:$port" "example.com" 2>&1 | Out-String | Write-Host
          Start-Sleep -Seconds 1
          if (-not $rec.HasExited) { Stop-Process -Id $rec.Id -Force -ErrorAction SilentlyContinue }

          if (-not (Test-Path $out)) {
            Get-Content (Join-Path $env:RUNNER_TEMP "rec.err") -ErrorAction SilentlyContinue | Write-Host
            Write-Host "::error::没有抓到 ClientHello"
            exit 1
          }
          "=== 探针指纹 ==="
          python tests/e2e/clienthello_capture.py --compute $out | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP "probe-ja3.json")
          Pop-Location

      - name: 汇总到 issue
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $lines = @("### boring-probe 结果", "", "- 构建耗时: $env:PROBE_BUILD_SECONDS 秒（0/空 = 未走到或失败）")
          $ja3 = Join-Path $env:RUNNER_TEMP "probe-ja3.json"
          if (Test-Path $ja3) {
            $obj = (Get-Content $ja3 -Raw) | ConvertFrom-Json
            $lines += "- 探针 JA3: ``$($obj.ja3)``"
            $lines += "- 探针 JA3 hash: ``$($obj.ja3_hash)``（Chrome 156 = cccf4f8d2e3c9bded07b40c216fe6216）"
            $lines += "- 探针 JA4: ``$($obj.ja4)``（Chrome 156 = t13d1517h2_）"
          } else {
            $lines += "- 未取得探针指纹"
          }
          $lines += ""
          $lines += "完整日志见 workflow run 页面（本 issue 只放结论，避免刷屏）。"
          ($lines -join "`n") | Out-File -Encoding utf8 (Join-Path $env:RUNNER_TEMP "summary.md")
          gh issue comment 1 --repo ${{ github.repository }} --body-file (Join-Path $env:RUNNER_TEMP "summary.md")

name: fingerprint

# 指纹对比实验：让流量经过被测引擎，问服务端「我们看起来像不像 Chrome」。
#
# 原理：tls.peet.ws 会把收到的 ClientHello 解析成 JA3/JA4 原样返回。
# 所以只要 curl 走我们的代理，返回的 JA3 就是「我们这套 TLS 栈的指纹」。
#
# 为什么要放 CI：本机没有 Rust 工具链，这个实验必须先有可运行的 ds-proxy。
#
# 踩过的坑（重要，别改回去）：
# 1. **代理必须和采集在同一个 step 里起停**。上一版把 Start-Process 放一个 step、
#    采集放下一个 step，结果 step 边界上进程被 runner 收掉了 —— 端口刚检测到就绪，
#    6 秒后 curl 就 exit=7（connection refused）。
# 2. 新分支 push 的提交如果已经在默认分支上，`paths` 过滤会认为「无改动」而不触发。
# 3. artifact 下载需要 token，所以结果直接贴到 issue #1。
on:
  push:
    branches: [fingerprint-experiment]
    paths:
      - '.github/workflows/fingerprint.yml'
      - 'tests/e2e/fingerprint_compare.ps1'
      - 'crates/**'
      - 'Cargo.toml'
  workflow_dispatch:
    inputs:
      compare:
        description: '标签（写进报告，便于区分多轮实验）'
        required: false
        default: 'rust'
        type: string

permissions:
  contents: read
  issues: write

jobs:
  fingerprint:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      LABEL: ${{ github.event.inputs.compare || 'rust' }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: 构建 ds-proxy
        run: cargo build --release -p ds-proxy

      - name: 生成自签 CA（MITM 需要）
        shell: pwsh
        run: |
          cargo run --release -p ds-tls --bin ds-ca
          Get-ChildItem "$env:USERPROFILE\.dev-sidecar" | Select-Object Name, Length | Format-Table | Out-String | Write-Host

      - name: 准备最小 running.json
        shell: pwsh
        run: |
          # 只保留实验需要的字段：监听端口 + 两个用来测指纹的域名
          $config = @{
            host = '127.0.0.1'
            port = 31182
            enabled = $true
            intercepts = @{
              'tls.peet.ws' = @{ '.*' = @{} }
              'tls.browserleaks.com' = @{ '.*' = @{} }
            }
            preSetIpList = @{}
            whiteList = @{}
            dynamicUpstreams = @{}
            intercept = @{ enabled = $true }
            dns = @{
              familyMapping = @{}
              providers = @{ local = @{ server = '127.0.0.1' } }
              mapping = @{}
              ech = @{ enabled = $false; domains = @(); dns = 'local' }
              nat64 = @{ enabled = $false; domains = @() }
              speedTest = @{ enabled = $false; interval = 60000; hostnameList = @(); dnsProviders = @() }
            }
            proxy = @{ engine = 'rust' }
            tlsFragment = @{ enabled = $false; size = 32; maxBytes = 2048; domains = @() }
            compatible = @{ connect = @{}; request = @{} }
            setting = @{ userBasePath = $env:RUNNER_TEMP; rootCaFile = @{}; timeoutMapping = @{} }
            app = @{}
            plugin = @{}
            fakeServerMaxLength = 262144
          }
          $path = Join-Path $env:RUNNER_TEMP 'running.json'
          $config | ConvertTo-Json -Depth 10 | Set-Content -Path $path -Encoding utf8
          Write-Host "已生成 $path"

      - name: 指纹采集（同一 step 内起停代理）
        shell: pwsh
        run: |
          $exe = 'target/release/ds-proxy.exe'
          $config = Join-Path $env:RUNNER_TEMP 'running.json'
          $out = Join-Path $env:RUNNER_TEMP 'proxy.out'
          $err = Join-Path $env:RUNNER_TEMP 'proxy.err'
          $md = Join-Path $env:RUNNER_TEMP 'fingerprint.md'

          $proc = Start-Process -FilePath $exe `
            -ArgumentList @('--config', $config, '--port', '31182') `
            -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          Write-Host "ds-proxy pid=$($proc.Id)"

          try {
            $ready = $false
            for ($i = 0; $i -lt 50; $i++) {
              Start-Sleep -Milliseconds 200
              if (Test-NetConnection -ComputerName 127.0.0.1 -Port 31182 -InformationLevel Quiet -WarningAction SilentlyContinue) {
                $ready = $true
                break
              }
            }
            Write-Host "端口就绪=$ready，进程已退出=$($proc.HasExited)"
            if (-not $ready) { throw '代理端口未就绪' }

            & pwsh -NoProfile -File tests/e2e/fingerprint_compare.ps1 -Label $env:LABEL `
              -ProxyUrl 'http://127.0.0.1:31182' -OutFile $md
            Write-Host "采集脚本退出码：$LASTEXITCODE"
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
            Write-Host '--- proxy.out（末尾 30 行）---'
            Get-Content $out -Tail 30 -ErrorAction SilentlyContinue | Write-Host
            Write-Host '--- proxy.err（末尾 30 行）---'
            Get-Content $err -Tail 30 -ErrorAction SilentlyContinue | Write-Host
          }

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fingerprint-${{ env.LABEL }}
          path: |
            ${{ runner.temp }}/fingerprint.md
            ${{ runner.temp }}/proxy.out
            ${{ runner.temp }}/proxy.err
          retention-days: 30

      - name: 结果贴到 issue #1
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $file = Join-Path $env:RUNNER_TEMP 'fingerprint.md'
          if (-not (Test-Path $file)) {
            "指纹采集没有产出结果（脚本提前退出）。" | Out-File -FilePath $file -Encoding utf8
          }
          foreach ($name in @('proxy.out', 'proxy.err')) {
            $diag = Join-Path $env:RUNNER_TEMP $name
            if ((Test-Path $diag) -and ((Get-Item $diag).Length -gt 0)) {
              Add-Content -Path $file -Value "`n<details><summary>$name（末尾 30 行）</summary>`n"
              Add-Content -Path $file -Value ((Get-Content $diag -Tail 30) -join "`n")
              Add-Content -Path $file -Value "`n</details>`n"
            }
          }
          $head = @"
          ### 指纹实验（自动）

          run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          commit: ``${{ github.sha }}``

          "@
          $body = $head + "`n" + (Get-Content $file -Raw)
          $body | Out-File -FilePath (Join-Path $env:RUNNER_TEMP 'comment.md') -Encoding utf8
          gh issue comment 1 --repo ${{ github.repository }} --body-file (Join-Path $env:RUNNER_TEMP 'comment.md')

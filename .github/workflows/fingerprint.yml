name: fingerprint

# 指纹对比实验：分别用两个引擎连 tls.peet.ws，读回服务端观测到的 JA3/JA4。
#
# 为什么要放 CI：本机没有 Rust 工具链，这个实验必须先有可运行的 ds-proxy。
# 手动触发即可，不会每天刷 Actions 额度。
on:
  # 临时触发器：把改动推到 fingerprint-experiment 分支即自动跑一次，
  # 结果直接贴到 issue #1（artifact 下载需要 token，issue 评论不需要）。
  push:
    branches: [fingerprint-experiment]
    paths:
      - '.github/workflows/fingerprint.yml'
      - 'tests/e2e/fingerprint_compare.ps1'
      - 'crates/**'
      - 'Cargo.toml'
  workflow_dispatch:
    inputs:
      compare:
        description: '要对比的引擎'
        required: false
        default: 'rust'
        type: choice
        options: [rust, node, both]

permissions:
  contents: read
  issues: write

jobs:
  fingerprint:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: 构建 ds-proxy
        run: cargo build --release -p ds-proxy

      - name: 准备最小 running.json
        shell: pwsh
        run: |
          # 只保留指纹实验需要的字段：监听端口 + 空规则（全部直连转发）
          $config = @{
            host = '127.0.0.1'
            port = 31182
            enabled = $true
            intercepts = @{}
            preSetIpList = @{}
            whiteList = @{}
            dynamicUpstreams = @{}
            intercept = @{ enabled = $true }
            dns = @{
              familyMapping = @{}
              providers = @{ local = @{ server = '127.0.0.1' } }
              mapping = @{}
              ech = @{ enabled = $false; domains = @(); dns = 'local' }
              nat64 = @{ enabled = $false; domains = @() }
              speedTest = @{ enabled = $false; interval = 60000; hostnameList = @(); dnsProviders = @() }
            }
            proxy = @{ engine = 'rust' }
            tlsFragment = @{ enabled = $false; size = 32; maxBytes = 2048; domains = @() }
            compatible = @{ connect = @{}; request = @{} }
            setting = @{ userBasePath = $env:RUNNER_TEMP; rootCaFile = @{}; timeoutMapping = @{} }
            app = @{}
            plugin = @{}
            fakeServerMaxLength = 262144
          }
          $path = Join-Path $env:RUNNER_TEMP 'running.json'
          $config | ConvertTo-Json -Depth 10 | Set-Content -Path $path -Encoding utf8
          Write-Host "已生成 $path"

      - name: 启动 ds-proxy
        shell: pwsh
        run: |
          $exe = 'target/release/ds-proxy.exe'
          $config = Join-Path $env:RUNNER_TEMP 'running.json'
          $proc = Start-Process -FilePath $exe -ArgumentList @('--config', $config, '--port', '31182') -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\proxy.out" -RedirectStandardError "$env:RUNNER_TEMP\proxy.err"
          "DS_PROXY_PID=$($proc.Id)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          for ($i = 0; $i -lt 50; $i++) {
            Start-Sleep -Milliseconds 200
            if (Test-NetConnection -ComputerName 127.0.0.1 -Port 31182 -InformationLevel Quiet -WarningAction SilentlyContinue) {
              Write-Host '端口已就绪'
              break
            }
          }
          Get-Content "$env:RUNNER_TEMP\proxy.err" -ErrorAction SilentlyContinue | Write-Host

      - name: 采集指纹
        shell: pwsh
        run: |
          pwsh -File tests/e2e/fingerprint_compare.ps1 -Label ${{ github.event.inputs.compare || 'rust' }} `
            -ProxyUrl http://127.0.0.1:31182 -OutFile "$env:RUNNER_TEMP\fingerprint.md"

      - name: 停止代理
        if: always()
        shell: pwsh
        run: |
          if ($env:DS_PROXY_PID) { Stop-Process -Id $env:DS_PROXY_PID -Force -ErrorAction SilentlyContinue }
          Get-Content "$env:RUNNER_TEMP\proxy.err" -ErrorAction SilentlyContinue | Select-Object -Last 30 | Write-Host

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fingerprint-${{ github.event.inputs.compare || 'rust' }}
          path: |
            ${{ runner.temp }}/fingerprint.md
            ${{ runner.temp }}/proxy.err
          retention-days: 30

      - name: 结果贴到 issue #1
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $file = Join-Path $env:RUNNER_TEMP 'fingerprint.md'
          if (-not (Test-Path $file)) {
            "指纹采集没有产出结果（脚本提前退出）。" | Out-File -FilePath $file -Encoding utf8
          }
          $head = @"
          ### 指纹实验（自动）

          run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          commit: ``${{ github.sha }}``

          "@
          $body = $head + "`n" + (Get-Content $file -Raw)
          $body | Out-File -FilePath (Join-Path $env:RUNNER_TEMP 'comment.md') -Encoding utf8
          gh issue comment 1 --repo ${{ github.repository }} --body-file (Join-Path $env:RUNNER_TEMP 'comment.md')

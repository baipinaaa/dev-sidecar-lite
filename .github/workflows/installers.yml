name: installers

# 三条流水线之一（ci / installers / release）。
#
# 这里产出一个**可安装、可运行**的 NSIS 安装包，并且当场装一遍验证，不发 release。
# 与 release.yml 的区别只有两点：不发布、不要求 tag。
#
# 历史教训（0.1.0）：这个文件以前用 robocopy 自己拼 core-bundle，而 release.yml 里
# 压根没有组装步骤 —— 两个文件各写一套、慢慢就漂了。现在两边都只调
# `scripts/prepare-core-bundle.mjs` + `scripts/prepare-binaries.ps1 -Strict`。

on:
  push:
    branches: [master, main]
    paths:
      - 'core-host/**'
      - 'app/**'
      - 'crates/**'
      - 'scripts/**'
      - '.github/workflows/installers.yml'
  pull_request:
    paths:
      - 'core-host/**'
      - 'app/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CORE_BUNDLE_MAX_MB: '70'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 组装 core-bundle + 构建全部二进制（同一个 step）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host '== 1/5 取 Node core 源码'
          if (Test-Path core-src) { Remove-Item -Recurse -Force core-src }
          git clone --depth 1 --filter=blob:none --sparse --branch master `
            https://github.com/baipinaaa/dev-sidecar-clean.git core-src
          if ($LASTEXITCODE -ne 0) { throw 'clone core 仓库失败' }
          git -C core-src sparse-checkout set packages/core packages/mitmproxy packages/gui/extra
          if (-not (Test-Path 'core-src/packages/gui/extra/sysproxy.exe')) { throw 'core 仓库缺少 gui/extra/sysproxy.exe' }

          Write-Host '== 2/5 安装 pnpm'
          npm install -g pnpm@12.14.0 --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw '安装 pnpm 失败' }

          Write-Host '== 3/5 组装 core-bundle'
          $env:PNPM_BIN = 'pnpm'
          node scripts/prepare-core-bundle.mjs --dev-sidecar core-src --max-mb $env:CORE_BUNDLE_MAX_MB
          if ($LASTEXITCODE -ne 0) { throw 'core-bundle 组装失败' }

          Write-Host '== 4/5 构建 Rust + Node SEA'
          cargo build --release --workspace
          if ($LASTEXITCODE -ne 0) { throw 'cargo build 失败' }
          npm install -g postject --no-audit --no-fund
          node core-host/scripts/build-sea.js
          if ($LASTEXITCODE -ne 0) { throw 'Node SEA 构建失败' }

          Write-Host '== 5/5 摆放 sidecar（缺文件直接失败）'
          pwsh -File scripts/prepare-binaries.ps1 -Strict
          if ($LASTEXITCODE -ne 0) { throw 'sidecar 二进制缺失' }

      # tauri-action 会在 app/ 下执行 `npm run tauri build`，
      # 没有 node_modules 时报 `'tauri' is not recognized`（installers/release 第一次跑就踩到了）
      - name: 安装 app 依赖
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: 打包安装包
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: app
          args: --target x86_64-pc-windows-msvc

      - name: 找到安装包
        id: find
        shell: pwsh
        run: |
          $found = Get-ChildItem -Recurse -File -Include *-setup.exe -Path `
            'app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis', `
            'app/src-tauri/target/release/bundle/nsis' -ErrorAction SilentlyContinue |
            Sort-Object Length -Descending | Select-Object -First 1
          if (-not $found) { throw '没有生成 NSIS 安装包' }
          Write-Host "安装包：$($found.FullName)（$([math]::Round($found.Length/1MB,1)) MB）"
          "path=$($found.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "size=$([math]::Round($found.Length/1MB,1))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: 安装冒烟（装包 → 布局 → healthz → getApiList → /pac.js → 卸载）
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          pwsh -File scripts/smoke-installer.ps1 -Installer '${{ steps.find.outputs.path }}'
          if ($LASTEXITCODE -ne 0) { throw '安装冒烟失败' }

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          if-no-files-found: error
          retention-days: 14
          path: |
            app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/nsis/*.exe

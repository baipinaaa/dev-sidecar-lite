name: acceptance

# 阶段 3 真场景验收：linux.do 是否还会落进 Cloudflare 挑战循环。
#
# 为什么必须在 CI：本机没有 Rust 工具链，这个验收必须有能跑的 ds-proxy 二进制。
#
# 两个关键约束（都踩过）：
# 1. 代理与测试必须在**同一个 step** 内起停 —— runner 会在 step 边界收掉后台进程，
#    表现为「端口刚就绪，下一步 curl 就 exit=7」。
# 2. 结论要能直接看：artifact 下载需要 token，所以报告同时贴到 issue #1。
on:
  push:
    branches: [acceptance-experiment]
    paths:
      - '.github/workflows/acceptance.yml'
      - 'tests/e2e/cf_acceptance.ps1'
      - 'crates/**'
      - 'Cargo.toml'
  workflow_dispatch:
    inputs:
      rounds:
        description: '每个目标跑几轮'
        required: false
        default: '3'
        type: string

permissions:
  contents: read
  issues: write

jobs:
  acceptance:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: 构建 ds-proxy
        run: cargo build --release -p ds-proxy

      - name: 生成自签 CA（MITM 需要）
        shell: pwsh
        run: |
          cargo run --release -p ds-tls --bin ds-ca

      - name: 准备验收用 running.json
        shell: pwsh
        run: |
          # ECH 打开，provider 用 Cloudflare 公共 DoH（runner 在境外可直连）
          $config = @{
            host = '127.0.0.1'
            port = 31183
            enabled = $true
            intercepts = @{
              # linux.do 走 Chrome 指纹通道（B1a）：验证 CF 是否还挑战
              'linux.do' = @{ '.*' = @{ fingerprint = 'chrome' } }
              '*.linux.do' = @{ '.*' = @{ fingerprint = 'chrome' } }
              '*.ldstatic.com' = @{ '.*' = @{} }
              'discord.com' = @{ '.*' = @{} }
              'huggingface.co' = @{ '.*' = @{} }
              'example.com' = @{ '.*' = @{} }
            }
            preSetIpList = @{}
            whiteList = @{}
            dynamicUpstreams = @{}
            intercept = @{ enabled = $true }
            dns = @{
              familyMapping = @{}
              providers = @{ cf = @{ server = 'https://cloudflare-dns.com/dns-query' } }
              mapping = @{}
              ech = @{
                enabled = $true
                use = $true
                dns = 'cf'
                domains = @('*linux.do', '*ldstatic.com', '*discord.com')
                tryAllProviders = $false
              }
              nat64 = @{ enabled = $false; domains = @() }
              speedTest = @{ enabled = $false; interval = 60000; hostnameList = @(); dnsProviders = @() }
            }
            proxy = @{ engine = 'rust' }
            tlsFragment = @{ enabled = $false; size = 32; maxBytes = 2048; domains = @() }
            compatible = @{ connect = @{}; request = @{} }
            setting = @{ userBasePath = $env:RUNNER_TEMP; rootCaFile = @{}; timeoutMapping = @{} }
            app = @{}
            plugin = @{}
            fakeServerMaxLength = 262144
          }
          $path = Join-Path $env:RUNNER_TEMP 'acceptance.json'
          $config | ConvertTo-Json -Depth 10 | Set-Content -Path $path -Encoding utf8
          Write-Host "已生成 $path"

      - name: CF 验收（同一 step 内起停代理）
        shell: pwsh
        run: |
          # 让 ds-proxy 打出 debug：ECH 命中 / 未命中、配置字节数都在这层
          $env:RUST_LOG = 'ds_proxy=debug,info'
          $report = Join-Path $env:RUNNER_TEMP 'acceptance.md'
          $rounds = '${{ github.event.inputs.rounds }}'
          if ([string]::IsNullOrWhiteSpace($rounds)) { $rounds = '3' }

          & pwsh -NoProfile -File tests/e2e/cf_acceptance.ps1 `
            -Exe 'target/release/ds-proxy.exe' `
            -Config (Join-Path $env:RUNNER_TEMP 'acceptance.json') `
            -Port 31183 `
            -Rounds ([int]$rounds) `
            -OutFile $report
          $code = $LASTEXITCODE
          Write-Host "验收脚本退出码：$code"
          "EXIT=$code" | Out-File -FilePath (Join-Path $env:RUNNER_TEMP 'acceptance.exit') -Encoding utf8

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-report
          path: |
            ${{ runner.temp }}/acceptance.md
            ${{ runner.temp }}/acceptance.exit
          retention-days: 30

      - name: 结果贴到 issue #1
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $file = Join-Path $env:RUNNER_TEMP 'acceptance.md'
          if (-not (Test-Path $file)) {
            "验收脚本没有产出报告（提前退出）。" | Out-File -FilePath $file -Encoding utf8
          }
          $exitFile = Join-Path $env:RUNNER_TEMP 'acceptance.exit'
          if (Test-Path $exitFile) {
            Add-Content -Path $file -Value "`n``````"
            Add-Content -Path $file -Value ((Get-Content $exitFile) -join "`n")
            Add-Content -Path $file -Value "``````"
          }
          $head = @"
          ### 验收报告（自动）

          run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          commit: ``${{ github.sha }}``
          runner 位置：GitHub 云端（非中国大陆），所以 GFW 干扰不在变量里，测的纯粹是 Cloudflare 对 TLS 指纹的判定。

          "@
          $body = $head + "`n" + (Get-Content $file -Raw)
          $body | Out-File -FilePath (Join-Path $env:RUNNER_TEMP 'comment.md') -Encoding utf8
          gh issue comment 1 --repo ${{ github.repository }} --body-file (Join-Path $env:RUNNER_TEMP 'comment.md')

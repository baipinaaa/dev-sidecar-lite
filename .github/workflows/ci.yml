name: CI

# 只做「格式 + 静态检查 + 单测」，不产出安装包。
# 发布流程见 release.yml（阶段 5）。

on:
  push:
    branches: [master, main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "rust-toolchain.toml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: windows-latest
    # 开发机没有 Rust 工具链，无法本地跑 `cargo fmt`，因此格式检查暂不阻断构建。
    # 首次成功编译后执行一次 `cargo fmt --all` 并提交，再把这里改回阻断。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      - name: cargo test
        run: cargo test --workspace --all-targets -- --nocapture
      - name: cargo build (release)
        run: cargo build --workspace --release

  # 失败时把编译器原话落到 issue 里。
  #
  # 起因：开发机没有 Rust 工具链，Actions 的日志又必须带 token 才能下载，
  # 于是「编译报错 → 谁去读」成了死循环。这里用 GITHUB_TOKEN 把
  # `cargo check --message-format=short` 的输出贴进 issue，公开可读、可 grep。
  diagnose:
    name: diagnose
    runs-on: windows-latest
    needs: [clippy, test]
    if: failure()
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test

      - name: 收集编译错误
        shell: bash
        run: |
          set +e
          # --color never：issue 里不需要 ANSI；errors 优先保留（tail 而不是 head），
          # 因为 cargo 把真正的报错放在最后。
          cargo check --workspace --all-targets --message-format=short --color never > raw.txt 2>&1
          echo "exit=$?" >> raw.txt
          grep -E "error|^warning: unused|-->" raw.txt > errors.txt || true
          echo "=== 上下文（最后 60 行）===" >> errors.txt
          tail -n 60 raw.txt >> errors.txt
          tail -n 60 errors.txt

      - name: 提交到 issue
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -e
          TITLE='[ci] 编译错误（自动收集）'
          {
            echo "commit: \`$SHA\`"
            echo "run: $RUN_URL"
            echo ''
            echo '```'
            head -c 55000 errors.txt
            echo '```'
          } > body.md
          existing=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number' || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
          else
            gh issue create --title "$TITLE" --body-file body.md
          fi

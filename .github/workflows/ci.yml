name: CI

# 只做「格式 + 静态检查 + 单测」，不产出安装包。
# 发布流程见 release.yml（阶段 5）。

on:
  push:
    branches: [master, main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "rust-toolchain.toml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: windows-latest
    # 开发机没有 Rust 工具链，无法本地跑 `cargo fmt`，因此格式检查暂不阻断构建。
    # 这里除了报告差异，还直接跑一次 `cargo fmt --all` 并把补丁作为 artifact 回传
    # （CI 不能自动提交），本地 `git apply` 一下即可，省去手工格式化整个工程。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt --check
        shell: bash
        run: |
          set +e
          cargo fmt --all -- --check
          echo "check_exit=$?" >> "$GITHUB_ENV"

      - name: 生成格式化补丁
        shell: bash
        run: |
          set -e
          cargo fmt --all
          git diff > rustfmt.patch || true
          git status --short >> rustfmt.patch || true
          echo "--- 补丁大小 ---"
          wc -c rustfmt.patch || true
          echo "--- 涉及文件 ---"
          git diff --stat | tail -n 20 || true

      - name: 回传补丁
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-patch
          path: rustfmt.patch
          retention-days: 30

  clippy:
    name: clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      # boring(BoringSSL) 在 Windows 上需要 nasm 编译汇编文件。
      - name: 安装 nasm
        run: choco install nasm -y --no-progress
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      # boring(BoringSSL) 在 Windows 上需要 nasm 编译汇编文件。
      - name: 安装 nasm
        run: choco install nasm -y --no-progress
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      - name: cargo test
        run: cargo test --workspace --all-targets -- --nocapture
      - name: cargo build (release)
        run: cargo build --workspace --release

  # 失败时把编译器原话落到 issue 里。
  #
  # 起因：开发机没有 Rust 工具链，Actions 的日志又必须带 token 才能下载，
  # 于是「编译报错 → 谁去读」成了死循环。这里用 GITHUB_TOKEN 把
  # `cargo check --message-format=short` 的输出贴进 issue，公开可读、可 grep。
  diagnose:
    name: diagnose
    runs-on: windows-latest
    needs: [clippy, test]
    if: failure()
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      # boring(BoringSSL) 在 Windows 上需要 nasm 编译汇编文件。
      - name: 安装 nasm
        run: choco install nasm -y --no-progress
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test

      - name: 收集编译 / clippy / 测试输出
        shell: bash
        run: |
          set +e
          {
            echo "### cargo check"
            cargo check --workspace --all-targets --message-format=short --color never 2>&1 | tail -n 40
            echo "### cargo clippy"
            cargo clippy --workspace --all-targets --message-format=short --color never 2>&1               | grep -E "^(crates|error|warning: unused)" | head -n 200
            echo "### cargo test"
            cargo test --workspace --all-targets --color never 2>&1               | grep -E "^(test result|failures:|---- |thread |error)" | head -n 120
          } > errors.txt 2>&1
          cat errors.txt

      - name: 提交到 issue
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -e
          TITLE='[ci] 编译错误（自动收集）'
          {
            echo "commit: \`$SHA\`"
            echo "run: $RUN_URL"
            echo ''
            echo '```'
            head -c 55000 errors.txt
            echo '```'
          } > body.md
          existing=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number' || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
          else
            gh issue create --title "$TITLE" --body-file body.md
          fi

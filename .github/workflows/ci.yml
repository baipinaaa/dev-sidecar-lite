name: ci

# 三条流水线之一（ci / installers / release）。
#
# ci 只做「不产出安装包」的检查：Rust 静态检查与单测、前端构建、core-host 端到端冒烟。
# 产包见 installers.yml，发版见 release.yml。
#
# 为什么把 core-host 冒烟放进 CI：0.1.0 的教训是「编译全绿、装完不能用」——
# Rust 侧 117 个单测全部通过，但控制面没把用户配置合并进来、数据面 bridge 找不到 mitmproxy，
# 这些问题只有跑起来才看得见。这里用 `-NodeEntry` 模式跑（不需要 SEA），
# 断言链：/healthz → getApiList → server.start → HEAD /pac.js 200 → server.close。

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CORE_BUNDLE_MAX_MB: '70'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Rust 数据面（路线 4 里是「实验通道」，但代码仍在仓库里，必须保持可编译、单测通过）
  # ---------------------------------------------------------------------------
  rust:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: rustfmt 检查（不阻断，仅回传补丁）
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::warning::存在未格式化的代码，正在生成补丁 artifact'
            cargo fmt --all
            git diff > rustfmt.patch
          }
          exit 0

      - name: 回传格式化补丁
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-patch
          path: rustfmt.patch
          if-no-files-found: ignore
          retention-days: 7

      - name: clippy（-D warnings）
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  # ---------------------------------------------------------------------------
  # 前端（移植过来的原版 view/**）
  # ---------------------------------------------------------------------------
  frontend:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: 构建
        working-directory: app
        run: npx vite build

      - name: 检查产物体积（>8MB 说明把 core-bundle 之类的静态资源带进前端了）
        shell: pwsh
        run: |
          $bytes = (Get-ChildItem app/dist -Recurse -File | Measure-Object Length -Sum).Sum
          $mb = [math]::Round($bytes / 1MB, 2)
          Write-Host "dist = $mb MB"
          if ($mb -gt 8) { throw "前端产物 $mb MB 过大" }

  # ---------------------------------------------------------------------------
  # core-host + core-bundle 端到端（最能兜住「装完不能用」的一关）
  # ---------------------------------------------------------------------------
  core-host:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 取 Node core 源码（sparse clone）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --depth 1 --filter=blob:none --sparse --branch master `
            https://github.com/baipinaaa/dev-sidecar-clean.git core-src
          if ($LASTEXITCODE -ne 0) { throw 'clone core 仓库失败' }
          git -C core-src sparse-checkout set packages/core packages/mitmproxy packages/gui/extra
          if (-not (Test-Path 'core-src/packages/gui/extra/sysproxy.exe')) { throw 'core 仓库缺少 gui/extra/sysproxy.exe' }

      - name: 安装 pnpm
        shell: pwsh
        run: |
          npm install -g pnpm@12.14.0 --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw '安装 pnpm 失败' }

      - name: 组装 core-bundle（含体积门禁与 require 自检）
        shell: pwsh
        env:
          PNPM_BIN: pnpm
        run: node scripts/prepare-core-bundle.mjs --dev-sidecar core-src --max-mb $env:CORE_BUNDLE_MAX_MB

      - name: core-host 冒烟（healthz → getApiList → 数据面 /pac.js → close）
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          pwsh -File scripts/smoke-core-host.ps1 -NodeEntry core-host/src/main.js -Port 31199 -ProxyPort 31198
          if ($LASTEXITCODE -ne 0) { throw 'core-host 冒烟失败' }

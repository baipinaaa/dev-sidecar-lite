[package]
name = "dev-sidecar-lite"
version = "0.2.1"
description = "DevSidecar Lite 桌面壳（Tauri 2 + Vue 3）"
authors = ["dev-sidecar-lite"]
edition = "2021"
rust-version = "1.82"
license = "MIT"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# 这个 crate 不属于仓库根的 Rust workspace（它由 Tauri 单独管理），
# 显式声明成独立 workspace，否则 `cargo metadata` 会报
# `current package believes it's in a workspace when it's not`。
[workspace]
